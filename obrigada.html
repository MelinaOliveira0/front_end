<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obrigado!</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="pagina-obrigado">

  <!-- TOPO -->
  <header style="width: 100%; height: 220px; padding: 60px 20px 0 20px; margin: 0; box-sizing: border-box;">
    <p class="subtitulo">Pedido recebido</p>
    <h1>Sabor da Casa</h1>
    <p class="slogan">Comida caseira feita com carinho</p>
  </header>

  <!-- CONTEÚDO -->
  <main style="width: 700px; max-width: 100%; box-sizing: border-box; padding: 0 20px; margin: 40px auto 60px auto;">

    <section class="obrigado" style="width: 100%; padding: 40px; box-sizing: border-box; margin: 0;">
      <div class="check">✓</div>

      <h2>Obrigado pelo seu pedido<span id="nome-cliente"></span>!</h2>

      <p class="obrigado-texto">
        Recebemos as suas informações e já estamos preparando tudo com carinho.
        Em breve entraremos em contato para confirmar o seu pedido.
      </p>
    </section>

  </main>

</body>
</html>
